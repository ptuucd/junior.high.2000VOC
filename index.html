    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #1a1a2e;
            --card: #16213e;
            --text: #e94560;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
        }

        /* 遊戲主區 */
        .game-panel {
            background: var(--card);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #0f3460;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #00d2ff;
        }

        .question-box {
            margin: 50px 0;
        }

        .word-en {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--text);
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        .opt-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid #0f3460;
            padding: 20px;
            font-size: 1.2rem;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .opt-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.02);
            border-color: var(--secondary);
        }

        .opt-btn.correct { background: var(--success) !important; border-color: #fff; }
        .opt-btn.wrong { background: var(--danger) !important; border-color: #fff; }

        /* 圖鑑區 */
        .collection-shelf {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #0f3460;
        }

        .badge-list {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .badge {
            font-size: 2rem;
            filter: grayscale(1) opacity(0.3);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .badge.active {
            filter: grayscale(0) opacity(1);
            transform: scale(1.3);
        }

        /* 側邊欄 - 錯題 */
        .sidebar {
            background: #0f3460;
            border-radius: 25px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar h3 { color: var(--text); border-bottom: 2px solid var(--text); padding-bottom: 10px; }

        #error-log {
            list-style: none;
            padding: 0;
            max-height: 500px;
            overflow-y: auto;
        }

        .error-card {
            background: rgba(0,0,0,0.2);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
        }

        .export-btn {
            width: 100%;
            padding: 12px;
            background: var(--text);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>

    let wordBank = [];
    let score = 0;
    let totalCount = 0;
    let errorWords = [];
    let currentWord = null;

    // --- 初始化解析資料 ---
    function initData() {
        const lines = rawData.split('\n');
        lines.forEach(line => {
            const parts = line.split(',');
            if (parts.length >= 2 && parts[1].trim() !== "") {
                wordBank.push({
                    ch: parts[0].trim(),
                    en: parts[1].trim()
                });
            }
        });
        nextQuestion();
    }

    // --- 遊戲邏輯 ---
    function nextQuestion() {
        if (wordBank.length < 3) return;

        // 隨機選題
        const correctIdx = Math.floor(Math.random() * wordBank.length);
        currentWord = wordBank[correctIdx];

        // 隨機選干擾項 (從題庫選另外兩個不同的中文意思)
        let distractors = [];
        while(distractors.length < 2) {
            let rand = wordBank[Math.floor(Math.random() * wordBank.length)];
            if (rand.en !== currentWord.en && !distractors.find(d => d.ch === rand.ch)) {
                distractors.push(rand);
            }
        }

        // 混亂選項
        const options = [...distractors, currentWord].sort(() => Math.random() - 0.5);

        // 渲染 UI
        document.getElementById('q-en').innerText = currentWord.en;
        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt.ch;
            btn.onclick = () => handleAnswer(btn, opt.en);
            optContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedBtn, selectedEn) {
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.style.pointerEvents = 'none'); // 鎖定點擊

        totalCount++;
        document.getElementById('count').innerText = totalCount;

        if (selectedEn === currentWord.en) {
            // 答對了
            selectedBtn.classList.add('correct');
            score += 10;
            document.getElementById('score').innerText = score;
            playSuccessEffects();
        } else {
            // 答錯了
            selectedBtn.classList.add('wrong');
            // 找出正確的那個按鈕標示出來
            btns.forEach(b => {
                if(wordBank.find(w => w.en === currentWord.en && w.ch === b.innerText)) {
                    b.classList.add('correct');
                }
            });
            logError(currentWord);
        }

        updateBadges();
        setTimeout(nextQuestion, 1200);
    }

    // --- 視覺與圖鑑 ---
    function playSuccessEffects() {
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#00d2ff', '#3a7bd5', '#ffffff']
        });
    }

    function updateBadges() {
        const badges = document.querySelectorAll('.badge');
        if (score >= 20) badges[0].classList.add('active');
        if (score >= 100) badges[1].classList.add('active');
        if (score >= 300) badges[2].classList.add('active');
        if (score >= 600) badges[3].classList.add('active');
        if (score >= 1000) badges[4].classList.add('active');
    }

    // --- 錯題管理 ---
    function logError(word) {
        if (!errorWords.find(w => w.en === word.en)) {
            errorWords.push(word);
            const list = document.getElementById('error-log');
            if (errorWords.length === 1) list.innerHTML = ''; // 清除提示文字
            
            const li = document.createElement('li');
            li.className = 'error-card';
            li.innerHTML = `❌ <b>${word.en}</b><br><small>正確解答：${word.ch}</small>`;
            list.prepend(li);
        }
    }

    function exportErrors() {
        if (errorWords.length === 0) {
            alert('目前沒有錯題紀錄！');
            return;
        }
        const ws = XLSX.utils.json_to_sheet(errorWords);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "錯題清單");
        XLSX.writeFile(wb, "國中單字重難點複習.xlsx");
    }

    // 啟動
    initData();
</script>
